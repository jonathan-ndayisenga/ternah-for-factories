{% extends "base.html" %}
{% block title %}Add Branch{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:0 auto">
  <h2 style="color:var(--ternah-navy);margin-bottom:.25rem">Add a Branch</h2>
  <p style="color:var(--muted);font-size:.9rem;margin-bottom:.5rem">
    Every branch gets its own inventory, sales and reports that roll up under your business.</p>
  <form method="post" class="stack">{% csrf_token %}
    <label>Branch name</label>
    <input name="name" required>
    <label>Type</label>
    <select name="kind">
      <option value="OUTLET">Outlet / Shop</option>
      <option value="FACTORY">Factory / Production site</option>
    </select>
    <label>Address</label>
    <textarea name="address" rows="2"></textarea>
    <button class="btn" style="margin-top:1.2rem">Create branch</button>
  </form>
</div>
{% endblock %}
