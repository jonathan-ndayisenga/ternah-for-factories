{% extends "base.html" %}
{% block title %}Record Purchase — {{ material.name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:0 auto">
  <h2 style="color:var(--ternah-navy);margin-bottom:.25rem">{{ material.name }}</h2>
  <p style="color:var(--muted);font-size:.9rem;margin-bottom:.5rem">Record a new purchase batch — tracked separately for FEFO and traceability.</p>
  <form method="post" class="stack" onsubmit="return confirmPurchase()">
    {% csrf_token %}
    <label>Quantity ({{ material.unit_of_measure }})</label>
    <input name="quantity" id="qty" type="number" step="0.001" min="0.001" required oninput="updateUnitCost()">
    <label>Total cost (UGX)</label>
    <input name="total_cost" id="totalCost" type="number" step="0.01" min="0.01" required oninput="updateUnitCost()">
    <label>Unit cost <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">(calculated automatically)</span></label>
    <input id="unitCostPreview" readonly value="—" style="background:var(--bg);font-weight:700;color:var(--ternah-navy)">

    <label>Purchase date</label>
    <input name="purchase_date" type="date" required>
    <label>Batch number</label>
    <input name="batch_number" placeholder="e.g. RM-PET-001">
    <label>Expiry date <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
    <input name="expiry_date" type="date">
    <label>Manufacture date <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
    <input name="manufacture_date" type="date">
    <label>Country of origin <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
    <input name="country_of_origin">
    <label>Supplier <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
    <input name="supplier" placeholder="Supplier name">

    <label style="display:flex;align-items:center;gap:.5rem;width:auto;margin-top:1rem;text-transform:none;letter-spacing:0;font-weight:600;font-size:.9rem">
      <input type="checkbox" name="on_credit" style="width:auto">Bought on credit — file a supplier payable
    </label>

    <button class="btn" style="margin-top:1.2rem">Record purchase</button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
function confirmPurchase() {
  const qty = document.getElementById("qty").value;
  const total = document.getElementById("totalCost").value;
  const onCredit = document.querySelector('input[name="on_credit"]').checked;
  const money = onCredit
    ? `UGX ${total} on credit — this files a supplier payable`
    : `UGX ${total} paid in cash — this reduces Cash on Hand`;
  return confirm(`Record this purchase?\n\n${qty} {{ material.unit_of_measure|escapejs }} of {{ material.name|escapejs }}\n${money}\n\nThis posts straight to the books and can't be edited afterward — only reversed by a correcting entry.`);
}
function updateUnitCost() {
  const qty = parseFloat(document.getElementById("qty").value);
  const total = parseFloat(document.getElementById("totalCost").value);
  const preview = document.getElementById("unitCostPreview");
  if (qty > 0 && total > 0) {
    preview.value = "UGX " + (total / qty).toFixed(4) + " / {{ material.unit_of_measure }}";
  } else {
    preview.value = "—";
  }
}
</script>
{% endblock %}
