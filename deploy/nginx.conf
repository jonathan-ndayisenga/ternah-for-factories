# /etc/nginx/sites-available/ternah — then: ln -s to sites-enabled, nginx -t, systemctl reload nginx
# Run certbot --nginx afterward; it rewrites this file to add the HTTPS server
# block and a 80->443 redirect automatically.

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    client_max_body_size 10M;

    # Serving these directly means gunicorn's 2 workers never spend time on
    # them — meaningful on a 1GB box where every worker cycle is precious.
    location /static/ {
        alias /root/ternah-for-factories/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /root/ternah-for-factories/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/ternah/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
